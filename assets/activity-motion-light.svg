<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="214" viewBox="0 0 1180 214" role="img" aria-labelledby="title"><title id="title">Animated activity bars that introduce the live GitHub account metrics below.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lane{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
.rise{animation:rise .6s cubic-bezier(.2,0,0,1) both}.d1{animation-delay:.10s}.d2{animation-delay:.20s}.d3{animation-delay:.30s}
.lane{animation:lane 5s cubic-bezier(.4,0,.2,1) infinite}.l2{animation-delay:.55s}.l3{animation-delay:1.1s}.glow{animation:glow 2.8s ease-in-out infinite}.draw{stroke-dasharray:160;animation:draw 1.1s cubic-bezier(.2,0,0,1) both}
@media(prefers-reduced-motion:reduce){.rise,.lane,.glow,.draw{animation:none!important;transform:none;opacity:1;stroke-dashoffset:0}}
</style><path d="M20 152h1140M20 98h1140M20 44h1140" stroke="#D9E2EC" stroke-width="1"/><path class="draw" style="animation-delay:0.0s" d="M72 166v-35" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.05s" d="M176 166v-72" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.1s" d="M280 166v-51" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.15000000000000002s" d="M384 166v-99" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.2s" d="M488 166v-64" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.25s" d="M592 166v-118" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.30000000000000004s" d="M696 166v-82" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.35000000000000003s" d="M800 166v-138" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.4s" d="M904 166v-104" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/><path class="draw" style="animation-delay:0.45s" d="M1008 166v-154" stroke="#7C3AED" stroke-width="18" stroke-linecap="round"/><text x="22" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#64748B">ACTIVITY MOTION</text><text x="1158" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">Live GitHub metrics below</text></svg>
