<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title"><title id="title">Pruthvi Raj Pudi — Data Analytics and Data Engineering portfolio.</title><style>
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
