<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title"><title id="title">Pruthvi Raj Pudi. Data analytics and data engineering.</title><style>
@keyframes enter{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes settle{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.65;transform:translateY(-4px)}}
@keyframes trace{to{stroke-dashoffset:-1250}}
@keyframes pair{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes arrow{0%,75%,87%,100%{transform:translateX(0)}81%,93%{transform:translateX(4px)}}
.enter{animation:enter .5s cubic-bezier(.4,0,.2,1) both}
.secondary{animation:settle .5s cubic-bezier(.4,0,.2,1) .1s both}
.ambient{animation:breathe 7s cubic-bezier(.4,0,.2,1) infinite}
.trace{stroke-dasharray:70 1180;animation:trace 9s linear infinite}
.pair{animation:pair .16s cubic-bezier(.2,0,0,1) both}
.link-arrow{animation:arrow 12s cubic-bezier(.4,0,.2,1) infinite}
@media(prefers-reduced-motion:reduce){
.enter,.secondary,.ambient,.trace,.pair,.link-arrow{animation:none!important;transform:none!important}
.enter,.secondary,.pair{opacity:1!important}.trace{stroke-dasharray:none}.ambient{opacity:.4}
}
</style><defs><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111C30"/><stop offset="1" stop-color="#191A36"/></linearGradient><radialGradient id="orb"><stop stop-color="#7C83EF" stop-opacity=".5"/><stop offset="1" stop-color="#7C83EF" stop-opacity="0"/></radialGradient><clipPath id="header-clip"><rect x="1" y="1" width="1198" height="188" rx="12"/></clipPath></defs><g clip-path="url(#header-clip)"><rect x="1" y="1" width="1198" height="188" rx="12" fill="url(#glow)" stroke="#28354D"/><g class="ambient"><ellipse cx="1080" cy="80" rx="210" ry="120" fill="url(#orb)"/></g><path d="M48 1H1152" stroke="#42517B" stroke-width="2"/><path class="trace" d="M48 1H1152" stroke="#9EADFF" stroke-width="3"/><g class="enter"><text x="48" y="85" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start" fill="#F1F5F9">Pruthvi Raj Pudi</text></g><g class="secondary"><text x="48" y="131" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#A6B4CB">Data Analytics  ·  Data Engineering</text></g><text x="1152" y="91" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#38BDF8">SQL  /  PYTHON</text><text x="1152" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="end" fill="#A78BFA">POWER BI  /  CLOUD</text></g></svg>
