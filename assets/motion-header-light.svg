<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-labelledby="title"><title id="title">Pruthvi Raj Pudi — Data Analytics and Data Engineering portfolio.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lane{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
