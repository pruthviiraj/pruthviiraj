<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="266" viewBox="0 0 1180 266" role="img" aria-labelledby="title"><title id="title">Four equal project tracks: Olist pipeline, sales analysis, sales warehouse, and HR dashboard.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lane{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
.rise{animation:rise .6s cubic-bezier(.2,0,0,1) both}.d1{animation-delay:.10s}.d2{animation-delay:.20s}.d3{animation-delay:.30s}
.lane{animation:lane 5s cubic-bezier(.4,0,.2,1) infinite}.l2{animation-delay:.55s}.l3{animation-delay:1.1s}.glow{animation:glow 2.8s ease-in-out infinite}.draw{stroke-dasharray:160;animation:draw 1.1s cubic-bezier(.2,0,0,1) both}
@media(prefers-reduced-motion:reduce){.rise,.lane,.glow,.draw{animation:none!important;transform:none;opacity:1;stroke-dashoffset:0}}
</style><path d="M240 34h860" stroke="#28354D" stroke-width="2"/><g class="lane l1"><circle cx="280" cy="34" r="8" fill="#60A5FA"/><path d="M304 34h96" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="34" r="5" fill="#60A5FA"/></g><text x="24" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#F1F5F9">Olist pipeline</text><text x="470" y="39" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#A6B4CB">Python · Azure · Snowflake · dbt</text><path d="M240 100h860" stroke="#28354D" stroke-width="2"/><g class="lane l2"><circle cx="280" cy="100" r="8" fill="#FACC15"/><path d="M304 100h96" stroke="#FACC15" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="100" r="5" fill="#FACC15"/></g><text x="24" y="105" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#F1F5F9">Sales analysis</text><text x="470" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#A6B4CB">Excel · targets · profit</text><path d="M240 166h860" stroke="#28354D" stroke-width="2"/><g class="lane l3"><circle cx="280" cy="166" r="8" fill="#F59E0B"/><path d="M304 166h96" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="166" r="5" fill="#F59E0B"/></g><text x="24" y="171" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#F1F5F9">Sales warehouse</text><text x="470" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#A6B4CB">SQL Server · quality checks</text><path d="M240 232h860" stroke="#28354D" stroke-width="2"/><g class="lane l1"><circle cx="280" cy="232" r="8" fill="#34D399"/><path d="M304 232h96" stroke="#34D399" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="232" r="5" fill="#34D399"/></g><text x="24" y="237" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#F1F5F9">HR dashboard</text><text x="470" y="237" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#A6B4CB">Power BI · sample workforce data</text></svg>
