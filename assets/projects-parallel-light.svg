<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="266" viewBox="0 0 1180 266" role="img" aria-labelledby="title"><title id="title">Four equal project tracks: Olist pipeline, sales analysis, sales warehouse, and HR dashboard.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lane{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
.rise{animation:rise .6s cubic-bezier(.2,0,0,1) both}.d1{animation-delay:.10s}.d2{animation-delay:.20s}.d3{animation-delay:.30s}
.lane{animation:lane 5s cubic-bezier(.4,0,.2,1) infinite}.l2{animation-delay:.55s}.l3{animation-delay:1.1s}.glow{animation:glow 2.8s ease-in-out infinite}.draw{stroke-dasharray:160;animation:draw 1.1s cubic-bezier(.2,0,0,1) both}
@media(prefers-reduced-motion:reduce){.rise,.lane,.glow,.draw{animation:none!important;transform:none;opacity:1;stroke-dashoffset:0}}
</style><path d="M240 34h860" stroke="#D9E2EC" stroke-width="2"/><g class="lane l1"><circle cx="280" cy="34" r="8" fill="#2563EB"/><path d="M304 34h96" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="34" r="5" fill="#2563EB"/></g><text x="24" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1E293B">Olist pipeline</text><text x="470" y="39" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#64748B">Python · Azure · Snowflake · dbt</text><path d="M240 100h860" stroke="#D9E2EC" stroke-width="2"/><g class="lane l2"><circle cx="280" cy="100" r="8" fill="#C0841A"/><path d="M304 100h96" stroke="#C0841A" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="100" r="5" fill="#C0841A"/></g><text x="24" y="105" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1E293B">Sales analysis</text><text x="470" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#64748B">Excel · targets · profit</text><path d="M240 166h860" stroke="#D9E2EC" stroke-width="2"/><g class="lane l3"><circle cx="280" cy="166" r="8" fill="#A16207"/><path d="M304 166h96" stroke="#A16207" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="166" r="5" fill="#A16207"/></g><text x="24" y="171" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1E293B">Sales warehouse</text><text x="470" y="171" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#64748B">SQL Server · quality checks</text><path d="M240 232h860" stroke="#D9E2EC" stroke-width="2"/><g class="lane l1"><circle cx="280" cy="232" r="8" fill="#0F9D58"/><path d="M304 232h96" stroke="#0F9D58" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="418" cy="232" r="5" fill="#0F9D58"/></g><text x="24" y="237" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1E293B">HR dashboard</text><text x="470" y="237" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#64748B">Power BI · sample workforce data</text></svg>
